name: Verify calibration research

on:
  pull_request:
    paths:
      - research/flash-color-calibration/**
      - .github/workflows/calibration-research.yml
      - docs/FLASH_CALIBRATION_RESEARCH.md
      - docs/POCKETSENSE_MOBILE_APP_ROADMAP.md
  push:
    branches-ignore: [main]
    paths:
      - research/flash-color-calibration/**
      - .github/workflows/calibration-research.yml
      - docs/FLASH_CALIBRATION_RESEARCH.md
      - docs/POCKETSENSE_MOBILE_APP_ROADMAP.md

permissions:
  contents: read

jobs:
  research:
    name: Research on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: research/flash-color-calibration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research and test dependencies
        run: python -m pip install ".[raw,test]"
      - name: Run research tests
        run: python -m pytest
      - name: Exercise synthetic CLI without camera data
        env:
          CALIBRATION_OUT: ${{ runner.temp }}/pocketsense-calibration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}
        run: python -m pocketsense_calibration synthetic --out "$CALIBRATION_OUT"
