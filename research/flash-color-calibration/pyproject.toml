[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsense-calibration-research"
version = "0.1.0"
description = "Offline experimental flash/no-flash color calibration research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10.4,<13",
  "scikit-image>=0.21,<0.27",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
raw = ["rawpy>=0.21,<0.29"]
test = ["pytest>=8,<10"]

[project.scripts]
pocketsense-calibration = "pocketsense_calibration.cli:main"

[tool.setuptools.packages.find]
include = ["pocketsense_calibration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
